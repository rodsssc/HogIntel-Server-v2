services:
  hogintel-api:
    build:
      context: ..              # Parent directory (repo root)
      dockerfile: docker/Dockerfile  # Path to Dockerfile from context
      args:
        MODE: prod
    container_name: hogintel-api
    ports:
      - "8000:8000"
    environment:
      - RUNNING_IN_DOCKER=1
      - PYTHONPATH=/app/app    # Match your Dockerfile
    env_file:
      - ../.env
    volumes:
      - hogintel-logs:/app/logs
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hogintel-logs: