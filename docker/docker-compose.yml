version: "3.9"

services:
  hogintel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODE: prod
    container_name: hogintel-api
    ports:
      - "8000:8000"
    environment:
      - RUNNING_IN_DOCKER=1
      - PYTHONPATH=/app
    env_file:
      - ../.env
    volumes:
      # Add volume for persistent logs
      - hogintel-logs:/app/logs
    restart: unless-stopped  # Better than 'always' for manual stops
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hogintel-logs: