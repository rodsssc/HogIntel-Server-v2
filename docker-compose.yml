services:
  hogintel-api:
    build:
      context: .              # Current directory (hogintel/)
      dockerfile: Dockerfile  # In same directory
      args:
        MODE: prod
    container_name: hogintel-api
    ports:
      - "8000:8000"
    environment:
      - RUNNING_IN_DOCKER=1
      - PYTHONPATH=/app/app
    env_file:
      - .env                  # In same directory
    volumes:
      - hogintel-logs:/app/logs
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hogintel-logs: